name: tests

on:
  push:
  pull_request:

jobs:
  modern-preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest numpy
      - name: Execute the paper dependency preflight
        run: >-
          python -m pytest tests/test_validation_and_invariants.py::test_build_preflight_runs_on_a_modern_interpreter -q

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with test deps)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build and inspect distributions
        if: matrix.python-version == '3.11'
        run: |
          python -m build
          python -m twine check dist/*
