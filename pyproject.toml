[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binml"
version = "1.0.0"
description = "A detectability-conditioned classifier for streaming Roman-like microlensing and variable-star light curves (6 classes: Flat, PSPL, NonPSPL, PeriodicVar, LongPeriodVar, Eruptive)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kunal Bhatia" }]
maintainers = [{ name = "Kunal Bhatia" }]
keywords = [
    "microlensing", "gravitational-microlensing", "astronomy", "astrophysics",
    "exoplanets", "deep-learning", "neural-network", "roman-space-telescope",
    "ogle", "light-curve", "classifier", "time-series",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
data = ["h5py>=3.0", "scipy>=1.7"]
all = ["matplotlib>=3.5", "h5py>=3.0", "scipy>=1.7", "scikit-learn>=1.0", "VBBinaryLensing"]
dev = ["matplotlib>=3.5", "h5py>=3.0", "scipy>=1.7", "scikit-learn>=1.0",
       "VBBinaryLensing", "pytest>=7.0", "build", "twine"]

[project.scripts]
binml = "binml.cli:main"

[project.urls]
Homepage = "https://github.com/kunalb541/BinML"
Repository = "https://github.com/kunalb541/BinML"
Documentation = "https://github.com/kunalb541/BinML/tree/main/docs"
Issues = "https://github.com/kunalb541/BinML/issues"

[tool.setuptools]
# binml.weights holds the checkpoints and no Python. It is listed EXPLICITLY because setuptools
# otherwise treats an importable data directory ambiguously: the files ship today via
# package-data, but the discovery configuration did not say so, and the warning is a real one.
packages = ["binml", "binml.legacy", "binml.weights", "pipeline"]
include-package-data = false

[tool.setuptools.package-data]
"binml.weights" = ["*.pt"]

[tool.pytest.ini_options]
markers = ["slow: integration tests that build from a clean archive"]
